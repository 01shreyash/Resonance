version: '3.8'

services:
  # 1. The Graph Database
  neo4j:
    image: neo4j:latest
    environment:
      - NEO4J_AUTH=neo4j/your_password_here  # Change this to a strong password!
    ports:
      - "7474:7474" # Neo4j Browser UI
      - "7687:7687" # Database Connection
    volumes:
      - neo4j_data:/data # Ensures your graph data doesn't delete on restart

  # 2. The Python AI Backend
  backend:
    build: ./recommendation_service
    ports:
      - "8000:8000"
    depends_on:
      - neo4j
    environment:
      # Tell Python to talk to the "neo4j" container, not localhost!
      - NEO4J_URI=neo4j://neo4j:7687
      - NEO4J_PASSWORD=your_password_here  # Make sure this matches your Docker setup!

  # 3. The React Frontend
  frontend:
    build: ./frontend-react
    ports:
      - "5173:5173"
    depends_on:
      - backend

# Define the persistent storage for the database
volumes:
  neo4j_data: